<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CANOPY 활동 기록 · 교사용</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap admin-wrap">
      <div class="eyebrow">교사용</div>
      <h1>CANOPY 활동 기록 모아보기</h1>
      <p>학생별 제출 내용을 확인하고 엑셀(CSV)로 내려받아 생기부 작성에 활용하세요.</p>
    </div>
  </header>

  <main class="wrap admin-wrap">
    <section id="lock" class="card" style="max-width:420px">
      <h2>관리자 비밀번호</h2>
      <p class="sub">Vercel 환경변수 ADMIN_PASSWORD에 설정한 값입니다.</p>
      <form id="lock-form">
        <label class="field"><input type="password" id="pw" placeholder="비밀번호" required /></label>
        <button class="btn block" type="submit">확인</button>
        <div id="lock-msg" class="msg err hidden"></div>
      </form>
    </section>

    <section id="board" class="hidden">
      <div class="card">
        <div class="toolbar">
          <input type="text" id="q" placeholder="학번·이름·내용 검색" />
          <select id="filter"><option value="">전체 활동</option></select>
          <button class="btn ghost" id="reload" type="button">새로고침</button>
          <button class="btn" id="csv" type="button">엑셀(CSV) 내려받기</button>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <script type="module" src="/admin.js"></script>
</body>
</html>
