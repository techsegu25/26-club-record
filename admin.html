<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>CANOPY 활동 기록 · 교사용</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap admin-wrap">
      <div class="eyebrow">교사용</div>
      <h1>CANOPY 활동 기록 모아보기</h1>
      <p><a href="./" style="color:#fff">← 학생 제출 페이지</a> · 학생별 제출 내용을 확인하고 엑셀(CSV)로 내려받아 생기부 작성에 활용하세요.</p>
    </div>
  </header>

  <main class="wrap admin-wrap">
    <section id="lock" class="card" style="max-width:440px">
      <h2>선생님 로그인</h2>
      <p class="sub">Firestore 규칙에 등록한 구글 계정으로 로그인하세요.</p>
      <button class="btn block" type="button" id="signin">Google 계정으로 로그인</button>
      <div id="lock-msg" class="msg err hidden"></div>
    </section>

    <section id="board" class="hidden">
      <div class="card">
        <div class="toolbar">
          <input type="text" id="q" placeholder="학번·이름·내용 검색" />
          <select id="filter"><option value="">전체 활동</option></select>
          <button class="btn ghost" id="reload" type="button">새로고침</button>
          <button class="btn" id="csv" type="button">엑셀(CSV) 내려받기</button>
          <span style="font-size:13px;color:var(--muted)"><span id="who"></span> · <a href="#" id="signout" style="color:inherit">로그아웃</a></span>
        </div>
        <div class="stats" id="stats"></div>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <script type="module" src="./admin.js"></script>
</body>
</html>
